<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selamat Datang di Website Saya</title>
  <style>
    /* Reset & Tampilan Dasar */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f8fafc;
      color: #334155;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Container Kartu Utama */
    .card {
      background: #ffffff;
      max-width: 600px;
      width: 100%;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      text-align: center;
      border: 1px solid #e2e8f0;
    }

    /* Avatar / Foto */
    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background-color: #2563eb;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: bold;
      margin: 0 auto 20px auto;
    }

    /* Judul & Teks */
    h1 {
      color: #0f172a;
      font-size: 1.8rem;
      margin-bottom: 10px;
    }

    p {
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    /* Tombol Aksi */
    .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background-color: #2563eb;
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: #1d4ed8;
    }

    .btn-secondary {
      background-color: #f1f5f9;
      color: #334155;
      border: 1px solid #cbd5e1;
    }

    .btn-secondary:hover {
      background-color: #e2e8f0;
    }

    /* Footer Sederhana */
    footer {
      margin-top: 30px;
      font-size: 0.85rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="avatar">A</div>
    <h1>Halo, Selamat Datang! 👋</h1>
    <p>
      Ini adalah halaman web sederhana yang di-host menggunakan <strong>GitHub Pages</strong>. 
      Website ini siap diisi dengan portofolio, proyek, atau informasi kontak Anda.
    </p>

    <div class="btn-group">
      <a href="https://github.com" class="btn btn-primary" target="_blank">Lihat Profil GitHub</a>
      <a href="mailto:email@domain.com" class="btn btn-secondary">Hubungi Saya</a>
    </div>

    <footer>
      &copy; 2026 Hosted with ❤️ on GitHub Pages
    </footer>
  </div>

</body>
</html>
